<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bg: linear-gradient(135deg, #0a0d14 0%, #0f172a 50%, #1a0a3e 100%);
      --card: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.12);
      --text: #f8fafc;
      --muted: #9ca3af;
      --accent: #f59e0b;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .box {
      width: min(92vw, 560px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .code {
      font-size: clamp(3rem, 12vw, 6rem);
      line-height: 1;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: .5rem;
    }
    .title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: .5rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .actions {
      display: flex;
      gap: .75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-accent {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #111827;
      border: none;
      font-weight: 700;
    }
    .btn-accent:hover { color: #111827; filter: brightness(1.05); }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="title">Page Not Found</div>
    <div class="subtitle">The page you requested does not exist or the connection was interrupted.</div>
    <div class="actions">
      <a href="/" class="btn btn-accent"><i class="bi bi-house-door me-1"></i>Go Home</a>
      <a href="/auth/login/" class="btn btn-outline-light"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a>
    </div>
  </div>
</body>
</html>
